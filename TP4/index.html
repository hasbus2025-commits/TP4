<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TP4 - Gestion des Commandes</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div class="container py-4">
    <h1 class="mb-4 text-center">Tableau de Bord des Commandes</h1>

    <!-- Zone des messages d'erreur -->
    <div id="error-container"></div>

    <!-- Indicateurs -->
    <div class="row mb-4 text-center" id="kpi-container">
      <div class="col-md-3 mb-2">
        <div class="card p-3 shadow-sm border-0">
          <small class="text-muted">Total Clients</small>
          <h3 id="kpi-customers">-</h3>
        </div>
      </div>
      <div class="col-md-3 mb-2">
        <div class="card p-3 shadow-sm border-0">
          <small class="text-muted">Total Produits</small>
          <h3 id="kpi-products">-</h3>
        </div>
      </div>
      <div class="col-md-3 mb-2">
        <div class="card p-3 shadow-sm border-0">
          <small class="text-muted">Total Commandes</small>
          <h3 id="kpi-orders">-</h3>
        </div>
      </div>
      <div class="col-md-3 mb-2">
        <div class="card p-3 shadow-sm border-0">
          <small class="text-muted">Chiffre d'Affaires</small>
          <h3 id="kpi-revenue">-</h3>
        </div>
      </div>
    </div>

    <!-- Filtres et Recherche -->
    <div class="card p-3 mb-4 shadow-sm border-0">
      <div class="row g-3">
        <div class="col-md-4">
          <input type="text" id="search-input" class="form-control" placeholder="Rechercher par client...">
        </div>
        <div class="col-md-4">
          <select id="status-filter" class="form-select">
            <option value="">Tous les statuts</option>
            <option value="Livree">Livree</option>
            <option value="En attente">En attente</option>
            <option value="Annulee">Annulee</option>
          </select>
        </div>
        <div class="col-md-4">
          <select id="category-filter" class="form-select">
            <option value="">Toutes les catégories</option>
            <!-- Rempli dynamiquement -->
          </select>
        </div>
      </div>
    </div>

    <!-- Zone Principale : Liste des Commandes -->
    <div id="orders-container" class="row g-3">
      <!-- Injecté dynamiquement par JS -->
    </div>
  </div>

  <!-- Modal Détail d'une Commande -->
  <div class="modal fade" id="orderModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="orderModalTitle">Détail de la commande</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
        </div>
        <div class="modal-body" id="orderModalBody">
          <!-- Injecté par JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
